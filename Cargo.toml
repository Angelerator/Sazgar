[package]
name = "sazgar"
version = "1.1.0"
edition = "2021"
description = "DuckDB extension for system monitoring and SQL routing with dialect translation - route queries to PostgreSQL, MySQL, BigQuery, Snowflake and more"
authors = ["Angelerator"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "sazgar"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "=1.10503.0", features = ["loadable-extension"] }
sysinfo = "0.32"
lazy_static = "1.5"
# PostgreSQL client for query routing (async with rustls TLS - no OpenSSL needed)
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
# Pure Rust TLS - works in CI without OpenSSL
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-postgres-rustls = "0.13"
rustls-pki-types = "1"
webpki-roots = "0.26"
chrono = "0.4"
# For GPU monitoring (NVIDIA)
nvml-wrapper = { version = "0.10", optional = true }
# For network port scanning (Linux/macOS only)
[target.'cfg(not(target_os = "windows"))'.dependencies]
netstat2 = "0.11"

[features]
default = []
nvidia = ["nvml-wrapper"]
